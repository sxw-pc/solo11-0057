table: demo.lake_orders
version: v2
fields:
  - name: order_id
    type: string
    nullable: false
    field_id: 1
  - name: price_details
    type: struct
    nullable: true
    field_id: 2
    fields:
      - name: amount
        type: decimal(10,2)
        nullable: true
        field_id: 21
        constraints:
          min: 0
          max: 50
      - name: currency
        type: string
        nullable: true
        field_id: 22
        constraints:
          values:
            - a
            - b
            - c
  - name: note
    type: string
    nullable: true
    field_id: 3
